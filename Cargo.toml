[package]
name = "chrona"
version = "0.1.0"
description = "tui time logging tool"
authors = ["Kostiantyn Shyrolapov <kostya.shirolapov@gmail.com>"]
license = "MIT"
edition = "2024"

[dependencies]
ratatui = { version = "0.30.0-alpha.4", features = ["all-widgets"] }
chrono = { version = "0.4.41", features = ["serde", "alloc"] }
toml = "0.8.23"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
directories = "6.0.0"
tui-input = "0.12.1"
strum = "0.27.1"
strum_macros = "0.27.1"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
unicode-segmentation = "1.12.0"
anyhow = "1.0.98"
dotenv = "0.15.0"
ureq = "3.1.0"
url = "2.5.4"
nanoid = "0.4.0"
