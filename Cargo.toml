[package]
name = "chrona"
version = "0.1.0"
description = "tui time logging tool"
authors = ["Kostiantyn Shyrolapov <kostya.shirolapov@gmail.com>"]
license = "MIT"
edition = "2024"

[dependencies]
ratatui = { version = "0.30.0-alpha.4", features = ["all-widgets"] }
chrono = { version = "0.4.41", features = ["serde"] }
color-eyre = "0.6.5"
toml = "0.8.23"
serde = { version = "1.0.219", features = ["derive"] }
directories = "6.0.0"
tui-textarea = "0.7.0"
tui-input = "0.12.1"
tui-widgets = "0.4.1"
strum = "0.27"
strum_macros = "0.27"
tui-logger = { version = "0.17.3", features = ["tracing-support"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
unicode-segmentation = "1.12.0"
